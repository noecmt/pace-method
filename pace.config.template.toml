# pace.config.toml — athlete instance config
#
# COPY THIS FILE to the root of your PACE artefact repo as `pace.config.toml`.
# This file is YOURS — it contains private URLs/IDs and should NOT be committed
# to the public PACE method pack.
#
# Precedence: pack defaults (customize.toml) < this file. Later wins, but only
# within the keys below. Hard rules, artefact contracts, and prohibitions are FIXED
# and can never be overridden here.
#
# Override stack for packs: the plugin install is read-only, so your custom sport
# and method packs live in `knowledge_base/{sports,methods}/` of THIS athlete repo.
# On an `id` collision they WIN over the plugin's base packs (same relative path,
# local wins). Generating a pack and activating it are separate steps — activate it
# declaratively (e.g. `[method] pack = "..."`).

[surface]
language = "en"        # output language: "en" | "fr" | ...
verbosity = "normal"   # terse | normal | rich

# ── Connectors ────────────────────────────────────────────────────────────────
# Which backend to use for each connector class.
# Graceful degradation is automatic: if the chosen backend is unavailable,
# PACE falls back to the local default (filesystem / local-csv / manual entry).
[connectors]
storage = "local"    # local | github | notion | gdrive
calendar = "local"   # local | gcal | notion
strava = true        # use the Strava MCP read connector when it is present (Phase-1 qualitative, on by default); set false to opt out

# To add more read connectors when available:
# intervals = false
# nolio = false

# ── Integration pointers ──────────────────────────────────────────────────────
# URLs and IDs for the active backends above.
# Leave empty ("") for backends you are not using.
[integrations]

# Storage
notion_root_page = ""     # URL of your root PACE page in Notion
github_repo = ""          # URL of your GitHub artefact repo
gdrive_folder_id = ""     # Google Drive folder ID

# Calendar
gcal_calendar_id = "primary"    # Google Calendar ID ("primary" or a specific ID)
notion_calendar_db_id = ""      # Notion sessions database ID (created on first use if empty)

# ── Custom metrics (opt-in, additive) ──────────────────────────────────────────
# Declare any extra scalar you track alongside a session. Each declared key may
# then appear in that session's `planned` / `actual` / `debrief` `custom` object
# (a flat snake_case map of scalars). Only DECLARED keys are read or written; an
# undeclared `custom` key is ignored and flagged by pace-validate. This is purely
# additive — it never bumps the artefact `schema_version` (stays "1.0").
#
# NOT for nutrition/recovery/any whole domain: a domain is a parallel advisor with
# its OWN artefact, never a key on the training session. `custom` is for a single
# scalar (HRV, sleep hours, bodyweight) you want recorded with a session.
[custom_metrics]
# [custom_metrics.hrv_ms]
# on    = ["actual"]            # positions allowed: planned | actual | debrief
# type  = "number"             # number | string | bool
# label = "Morning HRV (ms)"
#
# [custom_metrics.sleep_h]
# on    = ["actual"]
# type  = "number"
# label = "Sleep (hours)"
